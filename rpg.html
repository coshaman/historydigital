<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211a16">
  <title>잉크의 관청 — 페테르부르크 1847</title>
  <link rel="stylesheet" href="rpg/rpg.css">
  <link rel="stylesheet" href="rpg/choices.css">
</head>
<body>
  <main class="game-shell">
    <header class="topline"><div><span class="kicker">ПЕТЕРБУРГ · ИЮНЬ 1847</span><h1>도시의 손들</h1></div><div class="top-meta"><span id="place">네프스키 거리</span><span>1847년 6월 1일 · <time id="clock">09:00</time></span><button id="save">기록</button><button id="load" disabled>불러오기</button></div></header>
    <section class="playfield" aria-label="게임 화면"><canvas id="world" aria-label="픽셀 아트 상트페테르부르크"></canvas><div class="location-plate"><span id="mapname">네프스키 거리</span><small id="bodyname">바깥에서 바라보는 중</small></div><div class="hint" id="hint" aria-live="polite">방향키 또는 WASD로 이동 · E로 살펴보기</div></section>
    <section class="lower"><div class="journal"><div class="section-head"><span>현장 기록</span><button id="talk" disabled>대화</button><span id="coins">—</span></div><h2 id="headline">거리의 소리</h2><p id="journal-text">가게 문이 열릴 때마다 종이 냄새가 찬 공기 속으로 번진다. 사람들은 제 갈 길을 가고, 누구도 도시 전체를 한눈에 보지는 못한다.</p><div class="actions" id="actions"></div><details id="host-notebook" hidden><summary>이 몸의 수첩</summary><ul id="host-facts"></ul></details><div class="record-line" id="record" aria-live="polite">먼저 주변을 걸어 보세요.</div></div><nav class="touch-pad" aria-label="터치 이동"><button data-move="up" aria-label="위">↑</button><button data-move="left" aria-label="왼쪽">←</button><button data-move="down" aria-label="아래">↓</button><button data-move="right" aria-label="오른쪽">→</button><button class="use" id="use">살펴보기</button><button class="release" id="release">놓아주기</button></nav></section>
    <footer><span>이야기는 한 사람의 시야와 손이 닿는 데서 시작됩니다.</span><span>16×16 타일 · 이동 기록은 이 기기에 저장</span></footer>
  </main>
  <script src="rpg/ai/config.js"></script>
  <script type="module" src="rpg/main.js"></script>
</body>
</html>
